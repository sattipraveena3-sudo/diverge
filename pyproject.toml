[build-system]
requires=["setuptools>=75","wheel"]
build-backend="setuptools.build_meta"
[project]
name="diverge-physio"
version="0.1.0"
description="Relational divergence early-warning research toolkit for physiological signals"
readme="README.md"
requires-python=">=3.11"
dependencies=["numpy==2.3.5","pandas==2.2.3","scipy==1.17.0","scikit-learn==1.8.0","fastapi==0.128.2","uvicorn[standard]==0.40.0","pydantic==2.13.4","streamlit==1.54.0","plotly==6.5.2","joblib==1.5.3"]
[project.optional-dependencies]
dev=["pytest==9.0.2","pytest-cov==7.0.0","ruff==0.16.2","black==26.1.0","httpx==0.28.1","nbformat==5.10.4"]
physionet=["wfdb==4.3.0"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src","."]
testpaths=["tests"]
addopts="-q --disable-warnings --maxfail=1"
[tool.ruff]
line-length=100
target-version="py311"
[tool.ruff.lint]
select=["E","F","I","UP","B"]
[tool.black]
line-length=100
target-version=["py311"]
