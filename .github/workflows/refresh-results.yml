name: Refresh evaluation results
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: refresh-evaluation-results
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python scripts/evaluate.py
      - run: python scripts/render_results.py
      - name: Commit refreshed reproducible synthetic outputs
        run: |
          git add artifacts/evaluation.json docs/RESULTS.md
          if git diff --cached --quiet; then
            echo "Synthetic evaluation outputs are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refresh synthetic evaluation results"
          git push origin HEAD:main
