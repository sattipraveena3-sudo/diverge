name: CTU Publication Study

# Full real-data publication workflow. Results are committed only after verification.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 1 * *'
  push:
    branches: [main]
    paths:
      - 'src/diverge/ctu_chb.py'
      - 'src/diverge/ctu_features.py'
      - 'src/diverge/publication.py'
      - 'scripts/run_publication_suite.py'
      - '.github/workflows/publication-study.yml'
      - 'requirements.txt'
      - 'pyproject.toml'

permissions:
  contents: write

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publication-study:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies and project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run unit tests
        run: pytest -q

      - name: Cache CTU-CHB dataset
        id: cache-ctu
        uses: actions/cache@v4
        with:
          path: data/ctu_chb
          key: ctu-uhb-ctgdb-v1.0.0-552-records

      - name: Download CTU-CHB v1.0.0 from PhysioNet
        if: steps.cache-ctu.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/ctu_chb
          wget -q -r -N -c -np \
            https://physionet.org/files/ctu-uhb-ctgdb/1.0.0/ \
            -P data/ctu_chb

      - name: Verify real dataset
        run: |
          count="$(find data/ctu_chb -name '*.hea' | wc -l)"
          echo "Discovered ${count} CTU-CHB headers"
          test "${count}" -eq 552
          test "$(find data/ctu_chb -name '*.dat' | wc -l)" -eq 552

      - name: Run publication experiment suite
        run: |
          echo "Starting full leakage-safe 552-record real-data study at $(date -u)"
          python -u scripts/run_publication_suite.py data/ctu_chb \
            --output-dir artifacts/publication \
            --folds 5 \
            --repeats 3 \
            --seed 42
          echo "Publication suite finished at $(date -u)"

      - name: Verify publication outputs
        run: |
          test -s artifacts/publication/results.json
          test -s artifacts/publication/all_predictions.csv
          test -s artifacts/publication/all_fold_metrics.csv
          test -s artifacts/publication/figures/ablation_auprc.png
          test -s artifacts/publication/figures/horizon_auprc.png
          test -s docs/REAL_DATA_RESULTS.md
          python - <<'PY'
          import json, math
          from pathlib import Path
          report = json.loads(Path('artifacts/publication/results.json').read_text())
          assert report['protocol_version'] == '2.0-leakage-safe'
          assert report['cohort']['records_discovered'] == 552
          assert set(report['horizons']) == {'0', '5', '10', '20'}
          for name, horizon in report['horizons'].items():
              assert horizon['n_records'] > 0
              assert horizon['n_positive'] > 0 and horizon['n_negative'] > 0
              assert 'raw_only' in horizon['variants'] and 'full' in horizon['variants']
              for variant in horizon['variants'].values():
                  for metric in ('auprc', 'auroc', 'brier', 'ece'):
                      value = float(variant[metric]['mean'])
                      assert math.isfinite(value)
                      assert 0.0 <= value <= 1.0
          print('Verified real-data publication artifacts and metric ranges.')
          PY

      - name: Commit verified real-data summary to repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/REAL_DATA_RESULTS.md \
            artifacts/publication/results.json \
            artifacts/publication/figures/ablation_auprc.png \
            artifacts/publication/figures/horizon_auprc.png
          if git diff --cached --quiet; then
            echo "Verified real-data summary is already current."
          else
            git commit -m "refresh verified CTU real-data results"
            git push origin HEAD:main
          fi

      - name: Upload complete publication bundle
        uses: actions/upload-artifact@v4
        with:
          name: diverge-ctu-publication-results
          path: |
            artifacts/publication
            docs/REAL_DATA_RESULTS.md
          retention-days: 90
